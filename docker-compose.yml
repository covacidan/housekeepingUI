# Standalone compose for UI-only development.
# Production deployment is handled by housekeepingAPI/docker-compose.yml (combined stack).
services:
  ui:
    build: .
    container_name: housekeeping_ui
    ports:
      - "8082:80"
    networks:
      - housekeeping_net
    restart: unless-stopped

networks:
  housekeeping_net:
    external: true
    name: housekeeping_net
